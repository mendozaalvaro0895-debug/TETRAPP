<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0C0C0B">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>TETRAPLASTIC — Registro de Producción · Tapas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/auth.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#F7F6F2;color:#0C0C0B;min-height:100vh}

/* TOPBAR */
.topbar{background:#0C0C0B;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #1E7D6A;gap:10px}
.logo{font-family:'Playfair Display',serif;font-size:16px;font-weight:900;color:#fff}
.logo span{color:#7ECEC0}
.logo-sub{font-size:11px;color:rgba(255,255,255,.6)}
.user-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);padding:4px 12px;border-radius:20px}
.uavatar{width:26px;height:26px;border-radius:50%;background:#1A6B5B;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}

/* LAYOUT */
.wrap{max-width:680px;margin:0 auto;padding:20px 14px 60px}
.pantalla{display:none;animation:ds-slideUp .3s ease both}
.pantalla.vis{display:block}
@keyframes ds-slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.titulo{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;text-align:center;margin-bottom:4px}
.subtitulo{font-size:13px;color:#6B6B6A;text-align:center;margin-bottom:22px}

/* SELECCIÓN DE OPERARIO */
.op-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.op-sel-card{background:#fff;border:1.5px solid #E0DED8;border-radius:14px;padding:18px 12px;text-align:center;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.op-sel-card:hover,.op-sel-card:active{border-color:#1A6B5B;box-shadow:0 4px 16px rgba(26,107,91,.15);transform:translateY(-2px)}
.op-sel-av{width:52px;height:52px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff}
.op-sel-nombre{font-size:14px;font-weight:700;line-height:1.3}
.op-sel-cod{font-family:'DM Mono',monospace;font-size:10px;color:#6B6B6A;margin-top:3px}
.op-sel-card.sup{border:2.5px solid #1A6B5B;background:#EBF7F4}
.op-sel-card.sup .op-sel-nombre{font-weight:900}
.mtx-wrap{background:#fff;border:1.5px solid #E0DED8;border-radius:14px;padding:14px 16px;margin-top:22px}
.mtx-hdr{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.mtx-hdr-title{font-family:'Playfair Display',serif;font-size:16px;font-weight:800;color:#1A6B5B}
.mtx-hdr-sub{font-size:11px;color:#9A9A98}
.term-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;align-items:center;gap:10px;padding:9px 6px;cursor:pointer;border-radius:8px;border-top:1px solid #F7F6F2;-webkit-tap-highlight-color:transparent}
.term-row:hover{background:#F7F6F2}
.term-row-open{background:#EBF7F4}
.term-nombre{font-size:12px;font-weight:600;line-height:1.3}
.term-bar-wrap{background:#F7F6F2;border-radius:20px;height:14px;overflow:hidden}
.term-row-open .term-bar-wrap{background:#fff}
.term-bar{background:#1A6B5B;height:100%;border-radius:20px;transition:width .5s ease}
.term-val{font-family:'DM Mono',monospace;font-size:12px;font-weight:700;color:#1A6B5B;white-space:nowrap;text-align:right;min-width:72px}
.term-detalle{padding:8px 10px 12px 12px;display:flex;flex-direction:column;gap:16px;background:#EBF7F4;border-radius:0 0 8px 8px}
.term-detalle-vacio{font-size:11px;color:#9A9A98;font-style:italic}
.td-bloque{min-width:0}
.td-titulo{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#6B6B6A;margin-bottom:8px}
.dg{position:relative;display:flex;align-items:flex-end;gap:2px;height:210px;border-bottom:1px solid #C8EDE7}
.dg-meta{position:absolute;left:0;right:0;border-top:2px dashed #B83232;pointer-events:none;z-index:2}
.dg-meta span{position:absolute;right:0;bottom:2px;font-size:9px;font-weight:700;color:#B83232;background:rgba(235,247,244,.9);padding:0 4px;border-radius:3px;white-space:nowrap}
.dg-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.dg-col.clic{cursor:pointer;-webkit-tap-highlight-color:transparent}
.dg-col.clic:hover .dg-bar{filter:brightness(1.18)}
.dg-val{font-family:'DM Mono',monospace;font-size:7px;color:#1A6B5B;line-height:1.2;margin-bottom:2px;white-space:nowrap}
.dg-bar{width:100%;max-width:22px;border-radius:3px 3px 0 0;background:#1A6B5B}
.dg-bar.falta{background:#FEE2E2;border:1px dashed #B83232;height:28px}
.dg-bar.pend{background:#B87200;height:28px}
.dg-bar.aus{background:#D8D6D0;height:12px}
.dg-bar.hoy{background:transparent;border:1px dashed #1A6B5B;height:14px}
.td-hint{font-weight:500;text-transform:none;letter-spacing:0;color:#9A9A98}
.tp-fila{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:11px;padding:3px 4px;margin:0 -4px}
.tp-fila.clic{cursor:pointer;border-radius:6px;-webkit-tap-highlight-color:transparent}
.tp-fila.clic:hover{background:#F7F6F2}
.tp-fila.abierto{background:#fff}
.tp-nom{color:#0C0C0B;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-chev{display:inline-block;width:13px;color:#1A6B5B;font-size:10px}
.tp-barra{height:10px;background:#fff;border-radius:6px;overflow:hidden}
.tp-fila.abierto .tp-barra{background:#EBF7F4}
.tp-fill{height:100%;background:#1A6B5B;border-radius:6px}
.tp-und{font-family:'DM Mono',monospace;font-weight:700;color:#1A6B5B;white-space:nowrap}
.tp-und i{font-style:normal;font-weight:500;color:#9A9A98;margin-left:5px}
.tp-regs{margin:2px 0 8px 12px;padding:2px 10px;border-left:2px solid #C8EDE7;max-height:240px;overflow-y:auto}
.tp-reg{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:11px;padding:3px 0;border-bottom:1px dashed #C8EDE7}
.tp-reg-f{font-family:'DM Mono',monospace;font-size:10px;color:#6B6B6A;white-space:nowrap}
.tp-reg-t{color:#0C0C0B;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-reg-t.sin{color:#9A9A98;font-style:italic}
.tp-reg-u{font-family:'DM Mono',monospace;font-weight:700;color:#1A6B5B;white-space:nowrap}
.tp-regs-pie{font-size:9px;color:#9A9A98;padding-top:4px;text-align:right}
.hi-lista{max-height:340px;overflow-y:auto;padding-right:4px;border-top:1px solid #C8EDE7}
.hi-reg{padding:6px 0;border-bottom:1px solid #C8EDE7}
.hi-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px}
.hi-f{font-family:'DM Mono',monospace;font-size:10px;color:#6B6B6A;white-space:nowrap}
.hi-cmd{font-family:'DM Mono',monospace;font-size:10px;font-weight:700;color:#1A6B5B}
.hi-badge{font-size:9px;font-weight:800;border-radius:10px;padding:1px 7px;white-space:nowrap}
.hi-badge.ok{background:#DCFCE7;color:#166534}
.hi-badge.pend{background:#FFF3D6;color:#7A4800}
.hi-badge.rech{background:#FEE2E2;color:#991B1B}
.hi-total{margin-left:auto;font-family:'DM Mono',monospace;font-weight:700;color:#1A6B5B;white-space:nowrap}
.hi-motivo{font-size:10px;color:#B83232;margin:2px 0 0 2px}
.hi-t{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:10.5px;padding:1px 0 1px 6px;color:#6B6B6A}
.hi-t-p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hi-t-x{color:#0C0C0B;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi-t-x i{color:#9A9A98}
.hi-t-u{font-family:'DM Mono',monospace;font-weight:700;color:#1A6B5B;white-space:nowrap}
.dg-dias{display:flex;gap:2px;margin-top:3px}
.dg-d{flex:1;min-width:0;text-align:center;font-size:8px;color:#6B6B6A}
.dg-d.falta{color:#B83232;font-weight:800}
.dg-d.nolab,.dg-d.futuro,.dg-d.fuera{color:#9A9A98;opacity:.55}
.dg-resumen{font-size:11px;color:#6B6B6A;margin-top:8px;line-height:1.6}
.dg-resumen b.mal{color:#B83232}
.dg-resumen b.bien{color:#1A6B5B}
.dg-leyenda{display:flex;flex-wrap:wrap;gap:10px;font-size:9px;color:#9A9A98;margin-top:4px}
.dg-leyenda i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:-1px}
@media (max-width:520px){.dg-val{display:none}.dg,.dg-dias{gap:1px}.dg-d{font-size:7px;letter-spacing:-.5px}}
.field input.err{border-color:#B83232;background:#FEF2F2}
.op-sel-tag{font-size:9px;font-weight:800;letter-spacing:1px;color:#1A6B5B;margin-top:6px}

/* FORM */
.quien{display:flex;align-items:center;gap:12px;background:#0C0C0B;border-radius:14px;padding:12px 16px;margin-bottom:16px}
.quien-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.quien-nombre{font-size:15px;font-weight:700;color:#fff;flex:1}
.quien-corr{font-family:'DM Mono',monospace;font-size:10px;color:#7ECEC0}
.btn-cambiar{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer}

.sec{background:#fff;border:1.5px solid #D8D6D0;border-radius:14px;padding:16px;margin-bottom:14px}
.sec-label{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#1A6B5B;border-bottom:2px solid #C8EDE7;padding-bottom:8px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.paso-num{background:#1A6B5B;color:#fff;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:700;color:#3A3A38}
.field input,.field select,.field textarea{border:1.5px solid #C8C6C0;border-radius:10px;padding:11px 12px;font-size:16px;font-family:'DM Sans',sans-serif;background:#fff;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#1A6B5B}

/* TAREAS */
.tarea-card{border:1.5px solid #E0DED8;border-radius:12px;padding:12px;margin-bottom:10px;background:#FDFDFC;position:relative}
.tarea-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.tarea-num{font-size:11px;font-weight:800;color:#1A6B5B}
.btn-rm{background:#FEE2E2;border:none;color:#B83232;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer}
.btn-add{background:#EBF7F4;border:1.5px dashed #1A6B5B;color:#1A6B5B;border-radius:10px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;width:100%;margin-top:4px}
.btn-add:active{background:#C8EDE7}

/* AUTOCOMPLETE */
.ac-wrap{position:relative}
.ac-drop{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid #1A6B5B;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.15);z-index:999;max-height:45vh;overflow-y:auto;margin-top:3px}
.ac-count{padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#6B6B6A;background:#F7F6F2;border-bottom:1px solid #F0EDE8;position:sticky;top:0}
.ac-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid #F0EDE8}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item:active{background:#EBF7F4}
.ac-sku{font-family:'DM Mono',monospace;font-size:12px;font-weight:700;color:#1A6B5B}
.ac-grp{padding:6px 12px;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.ac-grp-ok{background:#DCFCE7;color:#166534}
.ac-grp-no{background:#FFF3D6;color:#7A4800}
.ac-vacio{padding:8px 12px;font-size:11px;color:#9A9A98;font-style:italic}
.ac-desc{font-size:12px;color:#3A3A38;margin-top:2px}

/* TOTAL */
.total-bar{background:#0C0C0B;border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.total-bar-lbl{font-size:11px;color:rgba(255,255,255,.5)}
.total-bar-val{font-family:'DM Mono',monospace;font-size:24px;font-weight:700;color:#7ECEC0}

/* BOTONES PRINCIPALES */
.btn-guardar{background:#1A6B5B;color:#fff;border:none;border-radius:12px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;width:100%;font-family:'DM Sans',sans-serif;letter-spacing:.3px}
.btn-guardar:hover{background:#0D4035}
.btn-guardar:active{transform:scale(.98)}
.btn-guardar:disabled{opacity:.5;cursor:wait}

/* ÉXITO */
.exito-box{background:#fff;border:1.5px solid #1A6B5B;border-radius:16px;padding:36px 24px;text-align:center}
.exito-ico{font-size:56px;margin-bottom:12px}
.exito-corr{font-family:'DM Mono',monospace;font-size:26px;font-weight:700;color:#1A6B5B;margin:10px 0}
.exito-det{font-size:13px;color:#6B6B6A;margin-bottom:24px;line-height:1.7}

.toast-msg{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A6B5B;color:#fff;padding:12px 22px;border-radius:10px;font-size:13px;font-weight:700;z-index:9999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.cargando{text-align:center;padding:50px 20px;color:#6B6B6A;font-size:13px}
.spinner{display:inline-block;width:26px;height:26px;border:3px solid #C8EDE7;border-top-color:#1A6B5B;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:480px){
  .op-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
}
/* ── Time Picker 12h ── */
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="logo">TETRA<span>PLASTIC</span></div>
    <div class="logo-sub">📝 Registro de Producción · Tapas</div>
  </div>
  <div class="user-pill">
    <div class="uavatar">OT</div>
  </div>
</div>

<div class="wrap">

  <!-- PANTALLA 1: SELECCIÓN DE OPERARIO -->
  <div class="pantalla vis" id="scrSel">
    <div class="titulo">¿Quién registra su producción?</div>
    <div class="subtitulo">Toca tu nombre para comenzar</div>
    <div id="opGrid" class="op-grid">
      <div class="cargando" style="grid-column:1/-1"><div class="spinner"></div><div>Cargando operarios…</div></div>
    </div>
    <div id="termometroWrap"></div>
  </div>

  <!-- PANTALLA 2: FORMULARIO -->
  <div class="pantalla" id="scrForm">
    <div class="quien">
      <div class="quien-av" id="qAv">?</div>
      <div>
        <div class="quien-nombre" id="qNombre">—</div>
        <div class="quien-corr">Correlativo: automático al guardar</div>
      </div>
      <div style="flex:1"></div>
      <button class="btn-cambiar" onclick="volverSeleccion()">↩ Cambiar</button>
    </div>

    <div class="sec">
      <div class="sec-label"><span class="paso-num">1</span> Datos del día</div>
      <div class="field"><label>Fecha</label><input type="date" id="fFecha"></div>
    </div>

    <div class="sec">
      <div class="sec-label"><span class="paso-num">2</span> Tareas realizadas</div>
      <div id="tareasWrap"></div>
      <button type="button" class="btn-add" onclick="addTarea()">+ Agregar tarea</button>
    </div>

    <div class="total-bar">
      <div>
        <div class="total-bar-lbl">Total unidades PT del día</div>
      </div>
      <div class="total-bar-val" id="totalVal">0</div>
    </div>

    <div class="sec">
      <div class="sec-label"><span class="paso-num">3</span> Observaciones</div>
      <div class="field"><textarea id="fObs" rows="2" placeholder="Notas del día (opcional)…"></textarea></div>
    </div>

    <button class="btn-guardar" id="btnGuardar" onclick="guardarRegistro()">💾 Guardar mi producción</button>
  </div>

  <!-- PANTALLA 3: ÉXITO -->
  <div class="pantalla" id="scrOk">
    <div class="exito-box">
      <div class="exito-ico">✅</div>
      <div class="titulo">¡Producción registrada!</div>
      <div class="exito-corr" id="okCorr">CMD-—</div>
      <div class="exito-det" id="okDet">—</div>
      <button class="btn-guardar" onclick="volverSeleccion()">👤 Registrar otro operario</button>
    </div>
  </div>

</div>

<script>
// SUPA_URL, SUPA_KEY, db y escHtml vienen de shared/auth.js

// ── Estado ────────────────────────────────────────────────────
var operarios = [];
var inventarioCache = [];
var opActual = null;
var tareaCount = 0;
var supervisorActual = { nombre: '', codigo: '' };

var PROCS_LIST = ['Armado','Banda','Liner','Impresión','Encajado','Flameado','Revisado (cavidad, deformidad o mancha)','Limpiar pestaña','Apoyo Serigrafía','Apoyo Producción','Otra tarea'];

// Metas de productividad (unidades por hora), atadas a cada tarea
var CAPACIDADES = {
  maquina_liner: 2500, maquina_armado: 2500,
  flameado: 1500, impresion: 1500,
  armado: 1500, liner: 1500, banda: 1500, encajado: 3000,
  revisadocavidaddeformidadomancha: 1200,
  limpiarpestana: 1200,
  apoyoserigrafia: 1200,
  apoyoproduccion: 1200,
  otratarea: 1200,
  manual: 1200, otro: 1200
};

function getCapacidad(proceso, metodo) {
  if (metodo === 'maquina_liner') return CAPACIDADES.maquina_liner;
  if (metodo === 'maquina_armado') return CAPACIDADES.maquina_armado;
  var p = (proceso || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z]/g, '');
  return CAPACIDADES[p] || CAPACIDADES.manual;
}

// ── Carga de datos ────────────────────────────────────────────
async function cargarOperarios() {
  try {
    var r = await db.from('personal')
      .select('codigo, nombre, iniciales, color_hex, rol, fecha_inicio, fecha_baja')
      .eq('area', 'tapas').eq('activo', true).order('codigo');
    if (r.error) throw r.error;
    var todos = r.data || [];
    // Supervisión también registra producción propia: va primero, con ficha diferenciada
    operarios = todos.slice().sort(function(a, b){
      return (b.rol === 'supervisor' ? 1 : 0) - (a.rol === 'supervisor' ? 1 : 0);
    });

    // Supervisor vigente: se toma de la tabla personal, nunca hardcodeado.
    // No se muestra en pantalla (el operario no necesita verlo), solo se
    // adjunta a la comanda al guardar.
    var sup = todos.find(function(p){ return p.rol === 'supervisor'; });
    supervisorActual = sup ? { nombre: sup.nombre, codigo: sup.codigo } : { nombre: '', codigo: '' };

    renderSeleccion();
  } catch(e) {
    console.error('cargarOperarios:', e);
    document.getElementById('opGrid').innerHTML =
      '<div class="cargando" style="grid-column:1/-1">❌ No se pudieron cargar los operarios.<br>Revisa tu conexión y recarga la página.</div>';
  }
}

async function cargarInventario() {
  try {
    var todos = [];
    var desde = 0;
    var BATCH = 1000;
    while (true) {
      var r = await db.from('inventario')
        .select('sku, descripcion, existencia, facturable')
        .eq('activo', true).range(desde, desde + BATCH - 1);
      if (r.error) throw r.error;
      todos = todos.concat(r.data || []);
      if (!r.data || r.data.length < BATCH) break;
      desde += BATCH;
    }
    inventarioCache = todos;
  } catch(e) { console.error('cargarInventario:', e); }
}

// ── Pantalla 1: selección ─────────────────────────────────────
function buildOpCard(op) {
  var color = op.color_hex || '#1A6B5B';
  var ini = op.iniciales || (op.nombre || '?').slice(0, 2).toUpperCase();
  var esSup = op.rol === 'supervisor';
  return '<div class="op-sel-card' + (esSup ? ' sup' : '') + '" onclick="elegirOperario(\'' + escHtml(op.codigo) + '\')">'
    + '<div class="op-sel-av" style="background:' + escHtml(color) + '">' + escHtml(ini) + '</div>'
    + '<div class="op-sel-nombre">' + escHtml(op.nombre) + '</div>'
    + '<div class="op-sel-cod">' + escHtml(op.codigo) + '</div>'
    + (esSup ? '<div class="op-sel-tag">★ SUPERVISIÓN</div>' : '')
    + '</div>';
}

// ── Personal y Roles: producción del mes por persona ──────────
// Mismo bloque que Tapas → Inicio: la barra es relativa a quien más lleva (100%),
// y al tocar un nombre se despliega el desglose por proceso.
var termComandas = [];          // solo las aprobadas (las que suman)
var termComandasTodas = [];     // todas las del mes, para distinguir "por aprobar" de "sin registro"
var termAsistencia = {};        // { codigo: { 'YYYY-MM-DD': estado } } — puede quedar vacío si no hay permiso de lectura
var feriadosSet = {};           // { 'YYYY-MM-DD': true }
var termExpandidoCodigo = null;

// Sin la columna (o anterior a la aprobación) = aprobada, igual que en el resto de la app
function comandaCuenta(c) { return !c.estado_aprobacion || c.estado_aprobacion === 'aprobada'; }

function fechaGT() {
  return new Date(Date.now() - 6 * 3600 * 1000).toISOString().slice(0, 10);
}

function undDeTarea(t) { return t.unidades_completadas || t.cantidad || 0; }

function unidadesPorOperario() {
  var map = {};
  termComandas.forEach(function(c) {
    (c.comanda_tareas || []).forEach(function(t) {
      if (t.estado !== 'Terminada') return;
      map[c.operario_id] = (map[c.operario_id] || 0) + undDeTarea(t);
    });
  });
  return map;
}

function procesosDeOperario(codigo) {
  var map = {};
  termComandas.forEach(function(c) {
    if (c.operario_id !== codigo) return;
    (c.comanda_tareas || []).forEach(function(t) {
      if (t.estado !== 'Terminada') return;
      var proc = t.proceso || 'Otra tarea';
      map[proc] = (map[proc] || 0) + undDeTarea(t);
    });
  });
  return map;
}

async function cargarTermometro() {
  try {
    var hoy = fechaGT();
    var desde = hoy.slice(0, 8) + '01';
    var ultimo = new Date(parseInt(hoy.slice(0, 4), 10), parseInt(hoy.slice(5, 7), 10), 0).getDate();
    var hasta = hoy.slice(0, 8) + (ultimo < 10 ? '0' : '') + ultimo;
    var r = await db.from('comandas')
      .select('*, comanda_tareas(proceso, cantidad, unidades_completadas, estado, tapa_sku, tapa_desc)')
      .gte('fecha', desde).lte('fecha', hasta);
    if (r.error) throw r.error;
    // Solo suman las comandas aprobadas
    termComandasTodas = r.data || [];
    termComandas = termComandasTodas.filter(comandaCuenta);

    // Asistencia y feriados del mes: permiten distinguir "no subió producción" de "ausente" o "domingo/feriado".
    // Si el rol no tiene permiso de lectura, el detalle sigue funcionando sin esa distinción.
    termAsistencia = {};
    feriadosSet = {};
    try {
      var ra = await db.from('asistencia_diaria').select('fecha,operador_codigo,estado')
        .eq('area', 'tapas').eq('turno', 'dia').gte('fecha', desde).lte('fecha', hasta);
      (ra.data || []).forEach(function(row) {
        if (!termAsistencia[row.operador_codigo]) termAsistencia[row.operador_codigo] = {};
        termAsistencia[row.operador_codigo][row.fecha] = row.estado;
      });
    } catch(e) { termAsistencia = {}; }
    try {
      var rf = await db.from('dias_feriados').select('fecha').gte('fecha', desde).lte('fecha', hasta);
      (rf.data || []).forEach(function(row) { feriadosSet[row.fecha] = true; });
    } catch(e) { feriadosSet = {}; }

    renderTermometro();
  } catch(e) { console.error('cargarTermometro:', e); }
}

// ── Detalle desplegable de cada persona: dos bloques ───────────
// 1) Producción diaria del mes (¿algún día sin registro?)  2) Productividad / habilidad
// (por proceso y por tapa+proceso). Mismo detalle que Tapas → Inicio → Personal y Roles.

// { 'YYYY-MM-DD': { und, cuenta, pend } } de UNA persona. `cuenta` = hay una comanda aprobada ese
// día; `pend` = solo hay comandas por aprobar (no suman, pero sí hubo registro).
function diarioDeOperario(codigo) {
  var m = {};
  termComandasTodas.forEach(function(c) {
    if ((c.operario_id || '—') !== codigo) return;
    var d = m[c.fecha] || (m[c.fecha] = { und: 0, cuenta: false, pend: false });
    if (comandaCuenta(c)) {
      d.cuenta = true;
      (c.comanda_tareas || []).forEach(function(t) {
        if (t.estado === 'Terminada') d.und += undDeTarea(t);
      });
    } else if (c.estado_aprobacion === 'pendiente') {
      d.pend = true;
    }
  });
  return m;
}

// Estado de un día del calendario para una persona (orden importa: producir un domingo cuenta).
function estadoDiaTerm(fecha, info, asis, o, hoy) {
  if (o.fecha_inicio && fecha < o.fecha_inicio) return 'fuera';
  if (o.fecha_baja && fecha > o.fecha_baja) return 'fuera';
  if (info && info.cuenta && info.und > 0) return 'prod';
  var dow = new Date(fecha + 'T12:00:00').getDay();
  if (dow === 0 || feriadosSet[fecha]) return 'nolab';
  if (fecha > hoy) return 'futuro';
  if (info && info.pend) return 'pend';
  if (asis && asis[fecha] === 'ausente') return 'aus';
  if (fecha === hoy) return 'hoy';
  return 'falta';
}

function compactoUnd(n) {
  return n >= 1000 ? (Math.round(n / 100) / 10).toString().replace(/\.0$/, '') + 'k' : String(n);
}

// Meta diaria por persona (línea punteada del gráfico) y alto máximo de barra (el gráfico mide 210px)
var META_DIA_GRAFICO = 15000;
var ALTO_BARRAS_DIA = 180;

function buildTermDiario(o) {
  var hoy = fechaGT();
  var ym = hoy.slice(0, 7);
  var ultimo = new Date(parseInt(hoy.slice(0, 4), 10), parseInt(hoy.slice(5, 7), 10), 0).getDate();
  var dias = diarioDeOperario(o.codigo);
  var asis = termAsistencia[o.codigo] || {};

  var estados = [], maxDia = 0, total = 0, conReg = 0, faltantes = [], pendientes = 0;
  for (var d = 1; d <= ultimo; d++) {
    var fecha = ym + '-' + (d < 10 ? '0' : '') + d;
    var info = dias[fecha];
    var st = estadoDiaTerm(fecha, info, asis, o, hoy);
    estados.push({ d: d, fecha: fecha, st: st, und: info ? info.und : 0 });
    if (st === 'prod') { conReg++; total += info.und; if (info.und > maxDia) maxDia = info.und; }
    else if (st === 'falta') faltantes.push(d);
    else if (st === 'pend') pendientes++;
  }

  // La escala llega siempre hasta la meta, así la línea punteada queda en su altura real
  var escalaDia = Math.max(maxDia, META_DIA_GRAFICO);
  var lineaMeta = '<div class="dg-meta" style="bottom:' + Math.round(META_DIA_GRAFICO / escalaDia * ALTO_BARRAS_DIA) + 'px"><span>Meta ' + META_DIA_GRAFICO.toLocaleString() + ' und/día</span></div>';

  var cols = estados.map(function(e) {
    var titulo = 'Día ' + e.d + ' · ';
    var barra = '', val = '';
    if (e.st === 'prod') {
      var h = Math.max(5, Math.round((e.und / escalaDia) * ALTO_BARRAS_DIA));
      barra = '<div class="dg-bar" style="height:' + h + 'px"></div>';
      val = '<div class="dg-val">' + compactoUnd(e.und) + '</div>';
      titulo += e.und.toLocaleString() + ' und';
    } else if (e.st === 'falta') {
      var aEse = asis[e.fecha];
      barra = '<div class="dg-bar falta"></div>';
      titulo += 'SIN registro de producción' + (aEse ? ' (asistencia: ' + aEse + ')' : ' (sin asistencia marcada)');
    } else if (e.st === 'pend') {
      barra = '<div class="dg-bar pend"></div>';
      titulo += 'registro por aprobar (aún no suma)';
    } else if (e.st === 'aus') {
      barra = '<div class="dg-bar aus"></div>';
      titulo += 'ausente';
    } else if (e.st === 'hoy') {
      barra = '<div class="dg-bar hoy"></div>';
      titulo += 'hoy, en curso';
    } else if (e.st === 'nolab') {
      titulo += feriadosSet[e.fecha] ? 'feriado' : 'domingo';
    } else if (e.st === 'fuera') {
      titulo += 'fuera de su período (ingreso/baja)';
    } else {
      titulo += 'aún no llega';
    }
    var clic = (e.st === 'prod' || e.st === 'pend');
    return '<div class="dg-col' + (clic ? ' clic' : '') + '" title="' + escHtml(titulo + (clic ? ' · toca para ver el detalle' : '')) + '"'
      + (clic ? ' data-cod="' + escHtml(o.codigo) + '" data-fecha="' + e.fecha + '" onclick="verDetalleDiaOperario(this, event)"' : '') + '>' + val + barra + '</div>';
  }).join('');
  var etiquetas = estados.map(function(e) {
    return '<div class="dg-d ' + e.st + '">' + e.d + '</div>';
  }).join('');

  var resumen;
  if (!conReg && !faltantes.length) {
    resumen = '<b>Sin registros este mes todavía.</b>';
  } else {
    resumen = 'Registró producción <b class="' + (faltantes.length ? '' : 'bien') + '">' + conReg + ' día' + (conReg === 1 ? '' : 's') + '</b>'
      + (conReg ? ' · promedio <b>' + Math.round(total / conReg).toLocaleString() + ' und/día</b>' : '')
      + (faltantes.length ? '<br><b class="mal">Sin registro: día' + (faltantes.length === 1 ? ' ' : 's ') + faltantes.join(', ') + '</b>' : '')
      + (pendientes ? '<br>' + pendientes + ' día' + (pendientes === 1 ? '' : 's') + ' con registro por aprobar' : '');
  }

  return '<div class="td-titulo">📅 Producción diaria <span class="td-hint">· toca una barra para ver su detalle</span></div>'
    + '<div class="dg">' + cols + lineaMeta + '</div><div class="dg-dias">' + etiquetas + '</div>'
    + '<div class="dg-resumen">' + resumen + '</div>'
    + '<div class="dg-leyenda"><span><i style="background:#1A6B5B"></i>produjo</span>'
    + '<span><i style="background:#FEE2E2;border:1px dashed #B83232"></i>sin registro</span>'
    + '<span><i style="background:#D8D6D0"></i>ausente</span>'
    + '<span><i style="background:#B87200"></i>por aprobar</span>'
    + '<span><i style="background:none;border-top:2px dashed #B83232;height:0;width:14px;vertical-align:3px"></i>meta ' + META_DIA_GRAFICO.toLocaleString() + ' und/día</span></div>';
}

// Texto "SKU — descripción" de una tarea (o solo la descripción si no hay SKU)
function etiquetaTapaTarea(t) {
  var sku = (t.tapa_sku || '').trim();
  var desc = (t.tapa_desc || '').trim();
  return sku ? ((desc && desc.indexOf(sku) === -1) ? sku + ' — ' + desc : (desc || sku)) : desc;
}

// Popup con lo que UNA persona registró UN día (toque en una barra de Producción diaria).
// Muestra las comandas con su estado y sus tareas; aquí solo se consulta (aprobar/editar es del master).
function verDetalleDiaOperario(el, event) {
  if (event) event.stopPropagation();
  var codigo = el.getAttribute('data-cod'), fecha = el.getAttribute('data-fecha');
  var cmds = termComandasTodas.filter(function(c) { return (c.operario_id || '—') === codigo && c.fecha === fecha; })
    .sort(function(a, b) { return String(a.created_at || '').localeCompare(String(b.created_at || '')); });
  var fechaLabel = new Date(fecha + 'T12:00:00').toLocaleDateString('es-GT', { weekday: 'long', day: 'numeric', month: 'long' });
  fechaLabel = fechaLabel.charAt(0).toUpperCase() + fechaLabel.slice(1);

  var ESTADO = { pendiente: ['#7A4800', '#FFF3D6', '⏳ Por aprobar'], rechazada: ['#991B1B', '#FEE2E2', '⛔ Rechazada'] };
  var total = 0;
  var html = cmds.map(function(c) {
    var e = ESTADO[c.estado_aprobacion] || ['#166534', '#DCFCE7', '✅ Aprobada'];
    var tareas = (c.comanda_tareas || []).filter(function(t) { return t.estado === 'Terminada'; });
    var sub = tareas.reduce(function(s, t) { return s + undDeTarea(t); }, 0);
    if (comandaCuenta(c)) total += sub;
    var filas = tareas.map(function(t) {
      var tapa = etiquetaTapaTarea(t);
      return '<div style="display:flex;align-items:flex-start;gap:8px;padding:4px 0;border-bottom:1px solid #E0DED8">'
        + '<span style="font-size:10px;font-weight:700;color:#6B6B6A;flex-shrink:0;width:70px;padding-top:1px">' + escHtml(t.proceso || 'Otra tarea') + '</span>'
        + '<span style="font-size:11px;color:#0C0C0B;flex:1;line-height:1.3">' + (tapa ? escHtml(tapa) : '<i style="color:#9A9A98">Sin tapa registrada</i>') + '</span>'
        + '<span style="font-size:11px;font-weight:700;color:#0C0C0B;flex-shrink:0;white-space:nowrap">' + undDeTarea(t).toLocaleString() + ' und</span></div>';
    }).join('');
    return '<div style="margin-bottom:10px">'
      + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">'
      +   '<span style="font-size:11px;font-weight:700;color:#1A6B5B;font-family:\'DM Mono\',monospace">' + escHtml(c.correlativo || 'Comanda') + '</span>'
      +   '<span style="font-size:9px;font-weight:800;border-radius:10px;padding:1px 7px;background:' + e[1] + ';color:' + e[0] + '">' + e[2] + '</span>'
      +   '<span style="margin-left:auto;font-size:12px;font-weight:800;color:#0C0C0B">' + sub.toLocaleString() + ' und</span></div>'
      + (c.estado_aprobacion === 'rechazada' && c.motivo_rechazo ? '<div style="font-size:10px;color:#B83232;margin-bottom:2px">Motivo: ' + escHtml(c.motivo_rechazo) + '</div>' : '')
      + (filas || '<div style="font-size:11px;color:#9A9A98;font-style:italic">Sin tareas terminadas</div>') + '</div>';
  }).join('') || '<div style="font-size:12px;color:#9A9A98;font-style:italic;padding:6px 0">Sin registros ese día</div>';

  var existente = document.getElementById('prodDiaPopupTapas');
  if (existente) existente.remove();
  var pop = document.createElement('div');
  pop.id = 'prodDiaPopupTapas';
  pop.style.cssText = 'position:fixed;z-index:9999;background:#fff;border:1.5px solid #1A6B5B;border-radius:10px;padding:14px 16px;width:min(440px,calc(100vw - 16px));max-height:min(380px,80vh);overflow-y:auto;box-shadow:0 8px 28px rgba(0,0,0,.22)';
  var x = event ? Math.min(event.clientX, window.innerWidth - 456) : 8;
  var y = event ? Math.min(event.clientY + 8, window.innerHeight - 400) : 60;
  pop.style.left = Math.max(8, x) + 'px'; pop.style.top = Math.max(8, y) + 'px';
  pop.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;padding-bottom:6px;border-bottom:1.5px solid #EBE9E4">'
    + '<div style="font-size:13px;font-weight:800;color:#0C0C0B">' + escHtml(fechaLabel) + '</div>'
    + '<div style="display:flex;align-items:center;gap:6px"><span style="font-size:12px;font-weight:800;color:#1A6B5B">' + total.toLocaleString() + ' und aprobadas</span>'
    + '<button onclick="document.getElementById(\'prodDiaPopupTapas\').remove()" style="background:none;border:none;font-size:17px;cursor:pointer;color:#9A9A98;line-height:1;padding:0 2px">✕</button></div></div>'
    + html;
  document.body.appendChild(pop);
  setTimeout(function() {
    document.addEventListener('click', function closeDiaOp(e2) {
      var p2 = document.getElementById('prodDiaPopupTapas');
      if (!p2 || !p2.contains(e2.target)) { if (p2) p2.remove(); document.removeEventListener('click', closeDiaOp); }
    });
  }, 60);
}

// Ingresos (tareas terminadas y aprobadas) de UN proceso de UNA persona, en orden cronológico.
function registrosDeProceso(codigo, proceso) {
  var regs = [];
  termComandas.forEach(function(c) {
    if ((c.operario_id || '—') !== codigo) return;
    (c.comanda_tareas || []).forEach(function(t) {
      if (t.estado !== 'Terminada' || (t.proceso || 'Otra tarea') !== proceso) return;
      regs.push({ fecha: c.fecha, cmd: c.correlativo || '', creada: c.created_at || '', tapa: etiquetaTapaTarea(t), und: undDeTarea(t) });
    });
  });
  regs.sort(function(a, b) {
    return a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : String(a.creada).localeCompare(String(b.creada));
  });
  return regs;
}

// Qué procesos están desplegados: 'codigo|proceso' → true. Varios pueden estar abiertos a la vez.
var termProcAbiertos = {};

function toggleTermProceso(el) {
  var k = el.getAttribute('data-cod') + '|' + el.getAttribute('data-proc');
  if (termProcAbiertos[k]) delete termProcAbiertos[k]; else termProcAbiertos[k] = true;
  renderTermometro();
}

function buildRegistroProceso(r) {
  var d = new Date(r.fecha + 'T12:00:00').toLocaleDateString('es-GT', { weekday: 'short', day: '2-digit', month: '2-digit' });
  return '<div class="tp-reg" title="' + escHtml(r.cmd) + '"><span class="tp-reg-f">' + escHtml(d) + '</span>'
    + (r.tapa
        ? '<span class="tp-reg-t" title="' + escHtml(r.tapa) + '">' + escHtml(r.tapa) + '</span>'
        : '<span class="tp-reg-t sin">Sin tapa registrada</span>')
    + '<span class="tp-reg-u">' + r.und.toLocaleString() + ' und</span></div>';
}

// Unidades del mes por proceso, en barras con su % del total; al tocar un proceso se despliegan sus ingresos.
function buildTermProcesos(o) {
  var procs = procesosDeOperario(o.codigo);
  var keys = Object.keys(procs).sort(function(a, b) { return procs[b] - procs[a]; });
  var titulo = '<div class="td-titulo">⚙️ Producción por proceso <span class="td-hint">· toca un proceso para ver sus ingresos</span></div>';
  if (!keys.length) return titulo + '<div class="term-detalle-vacio">Sin tareas registradas este mes</div>';
  var max = procs[keys[0]];
  var total = keys.reduce(function(s, k) { return s + procs[k]; }, 0);
  return titulo + keys.map(function(p) {
    var ancho = max > 0 ? Math.max(3, Math.round(procs[p] / max * 100)) : 0;
    var parte = total > 0 ? Math.round(procs[p] / total * 100) : 0;
    var abierto = !!termProcAbiertos[o.codigo + '|' + p];
    var html = '<div class="tp-fila clic' + (abierto ? ' abierto' : '') + '" data-cod="' + escHtml(o.codigo) + '" data-proc="' + escHtml(p) + '" onclick="toggleTermProceso(this)">'
      + '<span class="tp-nom" title="' + escHtml(p) + '"><span class="tp-chev">' + (abierto ? '▾' : '▸') + '</span>' + escHtml(p) + '</span>'
      + '<div class="tp-barra"><div class="tp-fill" style="width:' + ancho + '%"></div></div>'
      + '<span class="tp-und">' + procs[p].toLocaleString() + ' und<i>' + parte + '%</i></span></div>';
    if (abierto) {
      var regs = registrosDeProceso(o.codigo, p);
      html += '<div class="tp-regs">' + regs.map(buildRegistroProceso).join('')
        + '<div class="tp-regs-pie">' + regs.length + ' ingreso' + (regs.length === 1 ? '' : 's') + ' · por fecha</div></div>';
    }
    return html;
  }).join('');
}

// Historial de ingresos: TODAS las comandas que esa persona registró en el mes (aprobadas, por aprobar
// y rechazadas), la más reciente primero, con sus tareas.
function buildTermHistorial(o) {
  var regs = termComandasTodas.filter(function(c) { return (c.operario_id || '—') === o.codigo; })
    .sort(function(a, b) {
      return a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : String(b.created_at || '').localeCompare(String(a.created_at || ''));
    });
  var titulo = '<div class="td-titulo" style="margin-top:18px">📜 Historial de ingresos · ' + regs.length + '</div>';
  if (!regs.length) return titulo + '<div class="term-detalle-vacio">Sin ingresos este mes</div>';
  var ESTADO = { pendiente: ['pend', '⏳ Por aprobar'], rechazada: ['rech', '⛔ Rechazada'] };
  return titulo + '<div class="hi-lista">' + regs.map(function(c) {
    var e = ESTADO[c.estado_aprobacion] || ['ok', '✅ Aprobada'];
    var tareas = (c.comanda_tareas || []).filter(function(t) { return t.estado === 'Terminada'; });
    var total = tareas.reduce(function(s, t) { return s + undDeTarea(t); }, 0);
    var d = new Date(c.fecha + 'T12:00:00').toLocaleDateString('es-GT', { weekday: 'short', day: '2-digit', month: '2-digit' });
    var lineas = tareas.map(function(t) {
      var tapa = etiquetaTapaTarea(t);
      return '<div class="hi-t"><span class="hi-t-p">' + escHtml(t.proceso || 'Otra tarea') + '</span>'
        + '<span class="hi-t-x" title="' + escHtml(tapa) + '">' + (tapa ? escHtml(tapa) : '<i>Sin tapa registrada</i>') + '</span>'
        + '<span class="hi-t-u">' + undDeTarea(t).toLocaleString() + '</span></div>';
    }).join('');
    return '<div class="hi-reg"><div class="hi-top"><span class="hi-f">' + escHtml(d) + '</span>'
      + '<span class="hi-cmd">' + escHtml(c.correlativo || 'comanda') + '</span>'
      + '<span class="hi-badge ' + e[0] + '">' + e[1] + '</span>'
      + '<span class="hi-total">' + total.toLocaleString() + ' und</span></div>'
      + (c.estado_aprobacion === 'rechazada' && c.motivo_rechazo ? '<div class="hi-motivo">Motivo: ' + escHtml(c.motivo_rechazo) + '</div>' : '')
      + lineas + '</div>';
  }).join('') + '</div>';
}

function buildTermDetalle(o) {
  return '<div class="term-detalle">'
    + '<div class="td-bloque">' + buildTermDiario(o) + '</div>'
    + '<div class="td-bloque">' + buildTermProcesos(o) + buildTermHistorial(o) + '</div>'
    + '</div>';
}

function toggleTermDetalle(codigo) {
  termExpandidoCodigo = (termExpandidoCodigo === codigo) ? null : codigo;
  renderTermometro();
}

function buildTermometroRow(o, maxUnd) {
  var pct = maxUnd > 0 ? Math.round((o.und / maxUnd) * 100) : 0;
  var abierto = termExpandidoCodigo === o.codigo;
  var html = '<div class="term-row' + (abierto ? ' term-row-open' : '') + '" onclick="toggleTermDetalle(\'' + escHtml(o.codigo) + '\')">'
    + '<div class="term-nombre">' + escHtml(o.nombre) + '</div>'
    + '<div class="term-bar-wrap"><div class="term-bar" style="width:' + pct + '%"></div></div>'
    + '<div class="term-val">' + o.und.toLocaleString() + ' und</div>'
    + '</div>';
  if (abierto) html += buildTermDetalle(o);
  return html;
}

function renderTermometro() {
  var wrap = document.getElementById('termometroWrap');
  if (!wrap || !operarios.length) return;
  var und = unidadesPorOperario();
  var ops = operarios.map(function(p) {
    return { codigo: p.codigo, nombre: p.nombre, und: und[p.codigo] || 0, fecha_inicio: p.fecha_inicio || null, fecha_baja: p.fecha_baja || null };
  })
    .sort(function(a, b) { return b.und - a.und; });
  var maxUnd = ops.length ? ops[0].und : 0;
  var mes = new Date(fechaGT() + 'T12:00:00').toLocaleDateString('es-GT', { month: 'long', year: 'numeric' });
  wrap.innerHTML = '<div class="mtx-wrap">'
    + '<div class="mtx-hdr"><span class="mtx-hdr-title">👥 Personal y Roles</span>'
    + '<span class="mtx-hdr-sub">Producción de ' + escHtml(mes) + ' por operario · toca un nombre para ver su producción diaria y su habilidad por proceso y tapa</span></div>'
    + ops.map(function(o) { return buildTermometroRow(o, maxUnd); }).join('')
    + '</div>';
}

function renderSeleccion() {
  var g = document.getElementById('opGrid');
  if (!operarios.length) {
    g.innerHTML = '<div class="cargando" style="grid-column:1/-1">📭 No hay operarios activos en Tapas.</div>';
    return;
  }
  g.innerHTML = operarios.map(buildOpCard).join('');
  renderTermometro();
}

function elegirOperario(codigo) {
  opActual = operarios.find(function(o){ return o.codigo === codigo; });
  if (!opActual) return;

  // Refrescar inventario por si se cargaron SKUs nuevos durante el turno
  cargarInventario();

  document.getElementById('qAv').textContent = opActual.iniciales || '?';
  document.getElementById('qAv').style.background = opActual.color_hex || '#1A6B5B';
  document.getElementById('qNombre').textContent = opActual.nombre;

  // Reset del formulario
  tareaCount = 0;
  document.getElementById('tareasWrap').innerHTML = '';
  document.getElementById('fFecha').value = fechaGT();
  document.getElementById('fObs').value = '';
  document.getElementById('totalVal').textContent = '0';
  addTarea();

  mostrarPantalla('scrForm');
  window.scrollTo(0, 0);
}

function volverSeleccion() {
  opActual = null;
  cargarTermometro();
  mostrarPantalla('scrSel');
  window.scrollTo(0, 0);
}

function mostrarPantalla(id) {
  ['scrSel','scrForm','scrOk'].forEach(function(s){
    document.getElementById(s).classList.toggle('vis', s === id);
  });
}

// ── Pantalla 2: tareas ────────────────────────────────────────
function buildTareaCard(n) {
  var procsOpts = PROCS_LIST.map(function(p){ return '<option value="' + p + '">' + p + '</option>'; }).join('');
  return '<div class="tarea-card" id="tarea_' + n + '">'
    + '<div class="tarea-head"><span class="tarea-num">Tarea ' + n + '</span>'
    + '<button type="button" class="btn-rm" onclick="rmTarea(' + n + ')">✕ Quitar</button></div>'
    + '<div class="grid-2">'
    +   '<div class="field"><label>Proceso</label><select id="tarea_' + n + '_proc" onchange="toggleOtraProc(' + n + ')">' + procsOpts + '</select></div>'
    +   '<div class="field"><label>Cantidad</label><input type="number" inputmode="numeric" id="tarea_' + n + '_cant" min="0" placeholder="0" oninput="recalcTotal()"></div>'
    + '</div>'
    + '<div class="field" id="tarea_' + n + '_otro_wrap" style="display:none;margin-bottom:10px"><label>Especifica la tarea</label>'
    +   '<input type="text" id="tarea_' + n + '_otro" placeholder="Describe la tarea realizada…"></div>'
    + '<div class="field" style="margin-bottom:10px"><label>Tapa o envase trabajado *</label>'
    +   '<div class="ac-wrap">'
    +     '<input type="text" id="tarea_' + n + '_tapa" placeholder="Busca SKU o descripción y elige" autocomplete="off" oninput="acBuscar(\'tarea_' + n + '_tapa\',\'tarea_' + n + '_drop\',this.value)" data-sku="">'
    +     '<div class="ac-drop" id="tarea_' + n + '_drop"></div>'
    +   '</div>'
    + '</div>'
    + '<div class="field" style="margin-bottom:0"><label>Método</label><select id="tarea_' + n + '_met">'
    +     '<option value="manual">✋ Manual</option>'
    +     '<option value="maquina_liner">⚙ Máq. Liner PP33</option>'
    +     '<option value="maquina_armado">⚙ Máq. Armado PP28</option>'
    +   '</select></div>'
    + '</div>';
}

function toggleOtraProc(n) {
  var sel = document.getElementById('tarea_' + n + '_proc');
  var wrap = document.getElementById('tarea_' + n + '_otro_wrap');
  if (!sel || !wrap) return;
  wrap.style.display = sel.value === 'Otra tarea' ? 'block' : 'none';
}

function addTarea() {
  tareaCount++;
  document.getElementById('tareasWrap').insertAdjacentHTML('beforeend', buildTareaCard(tareaCount));
}

function rmTarea(n) {
  var el = document.getElementById('tarea_' + n);
  if (el) el.remove();
  recalcTotal();
}

function recalcTotal() {
  var total = 0;
  document.querySelectorAll('#tareasWrap .tarea-card').forEach(function(card){
    var n = card.id.replace('tarea_', '');
    total += parseInt((document.getElementById('tarea_' + n + '_cant') || {}).value || 0) || 0;
  });
  document.getElementById('totalVal').textContent = total.toLocaleString();
}

// ── Autocomplete de tapa trabajada ─────────────────────────────
function buildAcItem(inputId, dropId, item) {
  var sku = String(item.sku || '');
  var desc = String(item.descripcion || '');
  return '<div class="ac-item" onmousedown="acElegir(\'' + inputId + '\',\'' + dropId + '\',\''
    + escHtml(sku.replace(/'/g, '')) + '\',\'' + escHtml(desc.replace(/'/g, '')) + '\')">'
    + '<div class="ac-sku">' + escHtml(sku) + '</div>'
    + '<div class="ac-desc">' + escHtml(desc) + '</div>'
    + '</div>';
}

function acBuscar(inputId, dropId, query) {
  var drop = document.getElementById(dropId);
  if (!drop) return;
  // Al teclear de nuevo, la elección anterior ya no vale: hay que elegir de la lista
  var inp = document.getElementById(inputId);
  if (inp) { inp.dataset.sku = ''; inp.classList.remove('err'); }
  if (!query || query.length < 2) { drop.style.display = 'none'; return; }
  var toks = acNorm(query).split(/[^a-z0-9]+/).filter(Boolean);
  if (!toks.length) { drop.style.display = 'none'; return; }
  var results = inventarioCache.filter(function(i){
    var texto = acNorm((i.sku || '') + ' ' + (i.descripcion || ''));
    return toks.every(function(t){ return texto.indexOf(t) !== -1; });
  });
  if (!results.length) { drop.style.display = 'none'; return; }
  // null cuenta como facturable (igual que el bot); solo false es no facturable
  var fact = results.filter(function(i){ return i.facturable !== false; });
  var noFact = results.filter(function(i){ return i.facturable === false; });
  var html = '<div class="ac-count">' + results.length + ' coincidencia' + (results.length === 1 ? '' : 's') + '</div>';
  html += '<div class="ac-grp ac-grp-ok">✅ Facturables · ' + fact.length + '</div>'
    + (fact.length ? fact.map(function(i){ return buildAcItem(inputId, dropId, i); }).join('') : '<div class="ac-vacio">Ninguno facturable</div>');
  if (noFact.length) {
    html += '<div class="ac-grp ac-grp-no">⚠️ No facturables · ' + noFact.length + '</div>'
      + noFact.map(function(i){ return buildAcItem(inputId, dropId, i); }).join('');
  }
  drop.innerHTML = html;
  drop.style.display = 'block';
}

// Sin tildes y en minúsculas, para que "elíptica" encuentre "eliptica" y viceversa
function acNorm(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function acElegir(inputId, dropId, sku, desc) {
  var inp = document.getElementById(inputId);
  if (inp) {
    inp.value = sku + ' — ' + desc;
    inp.dataset.sku = sku;
    inp.classList.remove('err');
  }
  var drop = document.getElementById(dropId);
  if (drop) drop.style.display = 'none';
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.ac-wrap')) {
    document.querySelectorAll('.ac-drop').forEach(function(d){ d.style.display = 'none'; });
  }
});

// ── Guardar ───────────────────────────────────────────────────
function recopilarTareas() {
  var tareas = [];
  document.querySelectorAll('#tareasWrap .tarea-card').forEach(function(card){
    var n = card.id.replace('tarea_', '');
    var proceso = (document.getElementById('tarea_' + n + '_proc') || {}).value || '';
    if (proceso === 'Otra tarea') {
      var otro = ((document.getElementById('tarea_' + n + '_otro') || {}).value || '').trim();
      if (otro) proceso = otro;
    }
    var tapaInp = document.getElementById('tarea_' + n + '_tapa');
    var cantidad = parseInt((document.getElementById('tarea_' + n + '_cant') || {}).value || 0) || 0;
    var metodo = (document.getElementById('tarea_' + n + '_met') || {}).value || 'manual';
    var cap = getCapacidad(proceso, metodo);
    // Una tarjeta sin cantidad no es una tarea: no se guarda ni se le exige tapa
    if (cantidad > 0) {
      tareas.push({
        n: n,
        proceso: proceso,
        tapa_desc: tapaInp ? tapaInp.value : '',
        tapa_sku: (tapaInp && tapaInp.dataset.sku) || '',
        cantidad: cantidad,
        metodo: metodo,
        capacidad_hora: cap,
        horas_efectivas: cantidad > 0 ? Math.round((cantidad / cap) * 100) / 100 : 0,
        estado: 'Terminada',
        unidades_completadas: cantidad
      });
    }
  });
  return tareas;
}

async function guardarRegistro() {
  if (!opActual) { volverSeleccion(); return; }

  var fecha = document.getElementById('fFecha').value;
  if (!fecha) { showToast('⚠️ Selecciona la fecha', '#B83232'); return; }

  var tareas = recopilarTareas();
  if (!tareas.length) { showToast('⚠️ Agrega al menos una tarea con cantidad', '#B83232'); return; }

  // La tapa (o envase) es obligatoria en TODA tarea: sin ella no se puede medir qué tan
  // rápido ni en qué producto trabaja cada persona. Debe venir de la lista (SKU real);
  // si el catálogo no cargó, se acepta el texto escrito para no bloquear el registro.
  var catalogoListo = inventarioCache.length > 0;
  var sinTapa = tareas.filter(function(t) {
    return catalogoListo ? !t.tapa_sku : !String(t.tapa_desc || '').trim();
  });
  if (sinTapa.length) {
    var primera = document.getElementById('tarea_' + sinTapa[0].n + '_tapa');
    sinTapa.forEach(function(t) {
      var inp = document.getElementById('tarea_' + t.n + '_tapa');
      if (inp) inp.classList.add('err');
    });
    if (primera) {
      primera.scrollIntoView({ behavior: 'smooth', block: 'center' });
      primera.focus();
    }
    var hayTexto = catalogoListo && String(sinTapa[0].tapa_desc || '').trim();
    showToast(hayTexto
      ? '⚠️ Elige la tapa de la lista desplegable (tarea ' + sinTapa[0].n + ')'
      : '⚠️ Indica la tapa o envase trabajado en la tarea ' + sinTapa[0].n, '#B83232');
    return;
  }

  var totalPT = tareas.reduce(function(s, t){ return s + t.cantidad; }, 0);

  var cabecera = {
    // correlativo lo asigna la base de datos (trigger CMD-###)
    fecha: fecha,
    operario_id: opActual.codigo,
    operario_nombre: opActual.nombre || '',
    supervisor_id: supervisorActual.codigo || null,
    supervisor_nombre: supervisorActual.nombre || '',
    hora_inicio: null,
    hora_cierre: null,
    total_unidades: totalPT,
    observaciones: document.getElementById('fObs').value
  };

  var btn = document.getElementById('btnGuardar');
  btn.disabled = true;
  btn.textContent = 'Guardando…';

  try {
    var rCab = await db.from('comandas').insert(cabecera).select('id, correlativo').single();
    if (rCab.error) throw rCab.error;

    var tareasData = tareas.map(function(t, i) {
      return {
        comanda_id: rCab.data.id,
        orden: i + 1,
        proceso: t.proceso,
        tapa_desc: t.tapa_desc,
        tapa_sku: t.tapa_sku,
        cantidad: t.cantidad,
        metodo: t.metodo,
        capacidad_hora: t.capacidad_hora,
        horas_efectivas: t.horas_efectivas,
        unidades_completadas: t.unidades_completadas,
        estado: t.estado
      };
    });
    var rTar = await db.from('comanda_tareas').insert(tareasData);
    if (rTar.error) throw rTar.error;

    document.getElementById('okCorr').textContent = rCab.data.correlativo || '—';
    document.getElementById('okDet').innerHTML =
      escHtml(opActual.nombre) + ' · ' + escHtml(fecha)
      + '<br>' + tareas.length + ' tarea(s) · <strong>' + totalPT.toLocaleString() + ' und PT</strong>';
    mostrarPantalla('scrOk');
    window.scrollTo(0, 0);
  } catch(e) {
    console.error('guardarRegistro:', e);
    showToast('❌ Error al guardar: ' + (e.message || e), '#B83232');
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 Guardar mi producción';
  }
}

// ── Toast ─────────────────────────────────────────────────────
function showToast(msg, color) {
  var existing = document.querySelector('.toast-msg');
  if (existing) existing.remove();
  var t = document.createElement('div');
  t.className = 'toast-msg';
  t.textContent = msg;
  if (color) t.style.background = color;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3500);
}

// ── Init ──────────────────────────────────────────────────────
async function init() {
  await cargarOperarios();
  cargarTermometro();
  await cargarInventario();
}
init();
</script>
